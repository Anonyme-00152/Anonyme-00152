# .github/workflows/profile.yml — Anonyme-00152
# Génère chaque jour les cartes de stats, les projets épinglés et le serpent.

name: Mise à jour du profil

on:
  schedule:
    - cron: "0 */12 * * *"   # toutes les 12 h
  workflow_dispatch:          # bouton "Run workflow" manuel
  push:
    branches: [main]

permissions:
  contents: write

env:
  THEME: "&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=A78BFA&icon_color=A78BFA&text_color=C9D1D9"

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Carte de stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&rank_icon=github${{ env.THEME }}
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Langages les plus utilisés
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8${{ env.THEME }}
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Projet épinglé 1
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Gestion-Application&show_owner=false${{ env.THEME }}
          path: profile/pin-1.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Projet épinglé 2
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=halo-headphones&show_owner=false${{ env.THEME }}
          path: profile/pin-2.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Projet épinglé 3
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Bacalaureat&show_owner=false${{ env.THEME }}
          path: profile/pin-3.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Projet épinglé 4
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=password-generator-and-manage&show_owner=false${{ env.THEME }}
          path: profile/pin-4.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit des cartes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: mise à jour des cartes du profil" || exit 0
          git pull --rebase
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Génération du serpent
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#6d28d9&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#a78bfa,#7c3aed
            dist/snake-dark.svg?palette=github-dark&color_snake=#c4b5fd&color_dots=#161b22,#2e1065,#5b21b6,#7c3aed,#a78bfa

      - name: Publication sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
